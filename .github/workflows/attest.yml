name: attest

## Attested release binaries and image — GitHub `main` pushes only.
##
## Trigger: `push` to `refs/heads/main`, nothing else. No workflow_dispatch,
## no pull_request event can produce an attested artifact from this workflow.
##
## Guard chain (every step fail-closed: a refusal exits non-zero and nothing
## is attested or uploaded):
##   1. event guard  — this run is a push of refs/heads/main;
##   2. CI gate      — the `ci` workflow (path .github/workflows/ci.yml) must
##                     have concluded `success` for THIS exact head SHA. The
##                     GitHub REST API is polled with a deadline; a missing,
##                     disabled, renamed or non-green ci run refuses the build;
##   3. exact build  — actions/checkout at github.sha (credentials not
##                     persisted; the repo is public so the later anonymous
##                     git fetch works), then tools/ci_build.sh re-verifies
##                     HEAD == pushed SHA == re-fetched origin/main tip, a
##                     clean tree (untracked counts, like tools/build.sh) and
##                     the pinned Nim 2.2.10;
##   4. test gate    — `nimble test` runs again on the exact bits about to be
##                     attested, in this same job, so artifact and test
##                     evidence cannot diverge;
##   5. binary check — doctor must report BUILD/GIT lines that match the
##                     runner's real git state, and selftest must pass on the
##                     committed fixture. No user data (calendars, runs) is
##                     needed or read;
##   6. collector     — the second ci_build.sh subject (collector-linux-<arch>)
##                     is attested the same way and uploaded under its own
##                     artifact names, after the hongscanner binary is
##                     attested and uploaded;
##   7. image build   — ghcr.io login (github.actor + github.token), buildx,
##                     a mktemp STAGED context (the two attested
##                     CI_BUILD_OUT binaries + tracked repo files, the PR-2
##                     staging contract byte-identity asserted), then one
##                     `docker buildx build --push` of
##                     ghcr.io/wintrover/hongscanner:main-<sha7> — the
##                     immutable tag convention: one push per exact main
##                     SHA, a version tag is never overwritten, `latest` is
##                     never produced. NO deployment step follows: CD is
##                     explicitly out of scope, Northflank placement is a
##                     manual step on a specific version tag
##                     (tools/container/README.md §8);
##   8. image attest  — SLSA provenance on the PUSHED IMAGE DIGEST:
##                     subject-name is the registry FQDN WITHOUT the tag
##                     (tags are mutable, digests are not), subject-digest
##                     is the build-push-action digest output, and
##                     push-to-registry links it so
##                     `gh attestation verify oci://ghcr.io/wintrover/
##                     hongscanner@sha256:<digest>` resolves it (registry
##                     auth needed for that read).
##
## Path invariant: exactly two binary paths exist in this job,
## <CI_BUILD_OUT>/hongscanner and <CI_BUILD_OUT>/collector, both created
## once by tools/ci_build.sh and each used identically by every consumer —
## doctor/selftest (hongscanner), the usage smoke (collector), the
## attestation subjects, the checksums, the build reports, the artifact
## uploads and the image staging. CI_BUILD_OUT is a unique empty directory
## under RUNNER_TEMP, created once by mktemp(1) and exported once through
## GITHUB_ENV and the `builddir` step output; staging asserts both channels
## carry the same path. Nothing in this job writes inside the repository
## checkout (the only in-repo writes are the repo's own gitignored
## `nimble test` outputs, identical to the ci workflow), and no existing
## file anywhere is ever overwritten — so a local canonical repo-root
## ./hongscanner can never be clobbered, and no test artifact can be
## mistaken for an attested binary.
##
## Phase ordering invariant (PR-5): every image/GHCR step comes strictly
## AFTER the hongscanner attestation, the collector attestation and their
## artifact uploads. The local reinstall path (tools/install-attested.sh:
## binary artifact + repository attestation) therefore never depends on
## the image path — a build/push/attest-image failure leaves the binary
## evidence recorded. Failures are still failures: the job ends red, no
## image-phase error is swallowed or downgraded.
##
## Then actions/attest-build-provenance signs SLSA provenance statements
## with this job's OIDC identity and records them on this repository
## (digest <-> repo <-> exact main SHA <-> this run): one for each binary
## (hongscanner-linux-<arch>, collector-linux-<arch>) and one for the
## pushed image digest (subject-name ghcr.io/wintrover/hongscanner,
## push-to-registry). The binaries, their sha256s, the attestation
## bundles and build reports are retained as artifacts (separate names
## per subject); the image is retained on GHCR under the immutable
## main-<sha7> tag whose bytes the digest attestation pins.
##
## Why not `workflow_run`: it fires for every completed run of `ci` (including
## fork pull_request runs, needing extra guards) and its `github.sha` is the
## default-branch tip at fire time, which can drift from the ci run's SHA.
## Polling the runs API from the push event keeps the triggering SHA, the
## build checkout and the re-fetched main tip provably identical.
##
## Trust limits (docs/LIMITS.md "bounded trust" applies unchanged):
##   - Runner: shared, ephemeral, GitHub-hosted (Microsoft) VM. Trusted GitHub
##     infrastructure, nothing stronger; this attestation is not independent
##     of GitHub.
##   - Admin root: this file, tools/ci_build.sh, the ci workflow and branch
##     protection are editable by repo admins, so GitHub cannot prevent an
##     admin from weakening these gates. Attestation raises the evidence bar;
##     it does not remove the admin trust root.
##   - `provenance=OK` inside the binary stays self-reported metadata. What
##     the attestation adds is a GitHub-signed binding of the binary digest
##     to this repository, the exact main SHA and this workflow run.
##   - External actions are pinned to full commit SHAs resolved from
##     api.github.com (lightweight tags -> commits; docker/* resolved the
##     same way on 2026-11-02):
##       actions/checkout               v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
##       jiro4989/setup-nim-action      v2.3.1  189b145833368cc92f1e7b3e166a25a3e057a693
##       actions/setup-python           v5      a26af69be951a213d495a4c3e4e4022e16d87065
##       actions/attest-build-provenance v4.2.2 4d101475d8b20a2381f78447822ac1eab6504dd8
##       actions/upload-artifact        v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9
##       docker/login-action            v4.7.0  81c6f93d4bc991e510b342a00b419b3bb4efc5c6
##       docker/setup-buildx-action     v4.4.1  f87e5991a6d7451dcb8d9637bfbc97413f497069
##       docker/build-push-action       v7.4.0  c3c9e263c25d99ce0380d002d59b67737d91b0dc
##     Their internals still execute inside this job and remain trusted code.
##   - The CI gate reads this public repository's Actions data with the job
##     token (contents: read only; the REST docs allow the workflow-runs
##     endpoint without authentication for public resources, so `actions:
##     read` is deliberately NOT granted today). If the repo ever turns
##     private, that call fails closed; the fix then is to add `actions: read`
##     to this job's permissions.
##   - Artifacts are retained 90 days (the public-repository cap). The
##     repository attestations and the digests in the build report outlive
##     them; `gh attestation verify` re-checks anytime.
##   - ubuntu-latest floats: the exact kernel/glibc is recorded in the build
##     report, and the sha256 + attestation pin the exact bytes regardless.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  attest:
    name: attested release binaries + image (main push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write   # ghcr.io push (docker/login-action + build-push-action)
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Guard - this run must be a push of refs/heads/main (fail-closed)
        run: |
          set -euo pipefail
          [ "${GITHUB_EVENT_NAME}" = "push" ] || { echo "REFUSED: event_name=${GITHUB_EVENT_NAME}" >&2; exit 1; }
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "REFUSED: ref=${GITHUB_REF}" >&2; exit 1; }
          echo "GUARD OK event=push ref=refs/heads/main sha=${EXPECTED_SHA}"

      - name: CI gate - workflow 'ci' must conclude success on this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          limit=$((20 * 60))
          deadline=$((SECONDS + limit))
          fail_streak=0
          while :; do
            resp=""
            if ! resp="$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&event=push&per_page=20" 2>&1)"; then
              fail_streak=$((fail_streak + 1))
              echo "warn: gh api failed (attempt ${fail_streak}): ${resp}" >&2
              if [ "$fail_streak" -ge 10 ]; then
                echo "CI GATE FAIL: gh api failed ${fail_streak} consecutive times; refusing to attest" >&2
                exit 1
              fi
            else
              fail_streak=0
              run_json="$(printf '%s' "$resp" | jq -c '
                [.workflow_runs[]
                 | select(.path == ".github/workflows/ci.yml"
                          and .event == "push"
                          and .head_branch == "main"
                          and .status == "completed")]
                | first // empty')"
              if [ -n "$run_json" ]; then
                conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
                html_url="$(printf '%s' "$run_json" | jq -r '.html_url')"
                echo "ci run for ${EXPECTED_SHA}: ${html_url} -> status=completed conclusion=${conclusion}"
                if [ "$conclusion" = "success" ]; then
                  echo "CI GATE PASS: workflow 'ci' concluded success on the exact pushed SHA"
                  echo "CI_RUN_URL=${html_url}" >> "$GITHUB_ENV"
                  exit 0
                fi
                echo "CI GATE FAIL: ci conclusion='${conclusion}' (expected 'success') for ${EXPECTED_SHA}; refusing to attest" >&2
                exit 1
              fi
              echo "ci push run for ${EXPECTED_SHA} not completed yet; polling every 15s (elapsed ${SECONDS}s / limit ${limit}s)"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "CI GATE FAIL: no completed 'ci' push run for ${EXPECTED_SHA} within ${limit}s (ci.yml disabled/renamed/never triggered?); refusing to attest" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Checkout the exact pushed main SHA (credentials not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # fetch-depth defaults to 1; tools/ci_build.sh fetches main itself.

      - name: Install Nim 2.2.10 outside the workspace (keeps the tree clean)
        uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: '2.2.10'
          parent-nim-install-directory: ${{ runner.temp }}

      # The gate now includes the sidecar contract suite: it needs the same
      # documented interpreter line (tools/collector/README.md 11) as ci.yml.
      # The suite itself stays fail-closed: no interpreter is a failure.
      - name: Install Python 3.13 for the sidecar contract suite
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Test gate - full contract suite on the exact bits to be attested
        run: bash tools/run_tests.sh
        env:
          HSCOLLECTOR_PYTHON: python3

      - name: Create the isolated build output dir under RUNNER_TEMP (never in the repo)
        id: builddir
        run: |
          set -euo pipefail
          out="$(mktemp -d "${RUNNER_TEMP}/hs-ci-build.XXXXXXXX")"
          echo "CI_BUILD_OUT=${out}" >> "$GITHUB_ENV"
          echo "out=${out}" >> "$GITHUB_OUTPUT"
          echo "CI_BUILD_OUT=${out}"

      - name: Separate CI build into CI_BUILD_OUT with tools/build.sh-equivalent guards
        env:
          CI_BUILD_SHA: ${{ github.sha }}
          CI_BUILD_REF: main
        run: bash tools/ci_build.sh

      - name: Verify the binary's provenance claims against the runner git state
        run: |
          set -euo pipefail
          bin="${CI_BUILD_OUT}/hongscanner"
          [ -x "$bin" ] || { echo "REFUSED: ${bin} is missing" >&2; exit 1; }
          out="$("$bin" doctor || true)"
          printf '%s\n' "$out"
          # Calendar json files are user data and never committed, so doctor
          # can only reach DEGRADED calendar (exit 3) on a CI checkout. The
          # BUILD/GIT lines are what must hold for an attested binary.
          printf '%s\n' "$out" | grep -F "BUILD commit=${EXPECTED_SHA} source_ref=main origin_main=${EXPECTED_SHA} dirty=false nim=2.2.10"
          printf '%s\n' "$out" | grep -F "GIT head=${EXPECTED_SHA} origin_main=${EXPECTED_SHA} clean=true"
          if printf '%s\n' "$out" | grep -Eq 'BUILD=NOT_CANONICAL|BUILD=STALE|GIT=(NOT_CANONICAL_MAIN|DIRTY_TREE|UNKNOWN)'; then
            echo "REFUSED: doctor reports a degraded build environment" >&2
            exit 1
          fi

      - name: Smoke-run the binary on the committed fixture (no user data)
        run: |
          set -euo pipefail
          bin="${CI_BUILD_OUT}/hongscanner"
          [ -x "$bin" ] || { echo "REFUSED: ${bin} is missing" >&2; exit 1; }
          out="$("$bin" selftest)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F 'SELFTEST bytes=OK bars=22 signals=8'
          # 'SELFTEST provenance=NOT_CANONICAL' is expected even here: the
          # smoke run deliberately records fixture provenance
          # (tests/test_cli_contract.sh asserts the same for dev builds).

      - name: Smoke-run the collector binary on its usage contract (no live vendor)
        run: |
          set -euo pipefail
          col="${CI_BUILD_OUT}/collector"
          [ -x "$col" ] || { echo "REFUSED: ${col} is missing" >&2; exit 1; }
          out="$(mktemp "${RUNNER_TEMP}/hs-collector-smoke.XXXXXXXX")"
          rc=0
          "$col" > "$out" 2>&1 || rc=$?
          # No args is a usage error by contract (tools/collector exit
          # codes: 0 normal, 2 usage, 4 INCOMPLETE) and the usage text
          # names the required flags. Anything else refuses the run.
          if [ "$rc" -ne 2 ]; then
            echo "REFUSED: collector no-args exit=$rc (expected 2)" >&2
            cat "$out" >&2 || true
            exit 1
          fi
          printf '%s\n' "$(cat "$out")"
          grep -F 'collector --profile' "$out" >/dev/null \
            || { echo "REFUSED: usage text is missing the required flags" >&2; exit 1; }
          rm -f "$out"

      - name: Determine platform tag for artifact naming
        id: platform
        run: |
          set -euo pipefail
          m="$(uname -m)"
          case "$m" in
            x86_64) tag=amd64 ;;
            aarch64|arm64) tag=arm64 ;;
            *) tag="$m" ;;
          esac
          echo "tag=linux-${tag}" >> "$GITHUB_OUTPUT"

      - name: Attest the binary (SLSA build provenance, OIDC-signed)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.builddir.outputs.out }}/hongscanner
          subject-name: hongscanner-${{ steps.platform.outputs.tag }}

      - name: Stage checksums, attestation bundle and build report in CI_BUILD_OUT
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          PLATFORM_TAG: ${{ steps.platform.outputs.tag }}
          OUT_DECLARED: ${{ steps.builddir.outputs.out }}
        run: |
          set -euo pipefail
          if [ -z "$CI_BUILD_OUT" ] || [ "$CI_BUILD_OUT" != "$OUT_DECLARED" ]; then
            echo "REFUSED: path channels diverged: CI_BUILD_OUT='${CI_BUILD_OUT}' builddir.out='${OUT_DECLARED}'" >&2
            exit 1
          fi
          if [ -z "$BUNDLE_PATH" ] || [ ! -f "$BUNDLE_PATH" ]; then
            echo "REFUSED: attestation bundle missing at '${BUNDLE_PATH}'" >&2
            exit 1
          fi
          if [ -e "${CI_BUILD_OUT}/hongscanner.sha256" ] || [ -e "${CI_BUILD_OUT}/attestation" ]; then
            echo "REFUSED: refusing to overwrite existing files in ${CI_BUILD_OUT}" >&2
            exit 1
          fi
          ( cd "$CI_BUILD_OUT" && sha256sum hongscanner > hongscanner.sha256 )
          mkdir "${CI_BUILD_OUT}/attestation"
          cp "$BUNDLE_PATH" "${CI_BUILD_OUT}/attestation/hongscanner.attestation.bundle.json"
          digest="$(sha256sum "${CI_BUILD_OUT}/hongscanner" | cut -d' ' -f1)"
          {
            echo "hongscanner attested release build"
            echo "subject name:    hongscanner-${PLATFORM_TAG}"
            echo "subject digest:  sha256:${digest}"
            echo "built binary:    ${CI_BUILD_OUT}/hongscanner (isolated runner-temp dir)"
            echo "main sha:        ${EXPECTED_SHA} (HEAD == re-fetched origin/main, tools/ci_build.sh)"
            echo "commit:          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${EXPECTED_SHA}"
            echo "workflow run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "ci gate:         workflow 'ci' success on ${EXPECTED_SHA}: ${CI_RUN_URL:-<unrecorded>}"
            echo "event/ref:       ${GITHUB_EVENT_NAME} / ${GITHUB_REF}"
            echo "runner:          ${RUNNER_NAME} $(uname -srm)"
            echo "glibc:           $(ldd --version | head -1)"
            echo "nim:             $(nim --version | head -1)"
            echo "binary sha256:   ${digest}  hongscanner"
            echo "attestation id:  ${ATTESTATION_ID:-}"
            echo "attestation url: ${ATTESTATION_URL:-}"
            echo "verify later:    gh attestation verify hongscanner --repo ${GITHUB_REPOSITORY}"
          } > "${CI_BUILD_OUT}/attestation/build-report.txt"
          cat "${CI_BUILD_OUT}/attestation/build-report.txt"

      - name: Upload attested binary + sha256 (90 days, public-repo cap)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hongscanner-${{ steps.platform.outputs.tag }}
          path: |
            ${{ steps.builddir.outputs.out }}/hongscanner
            ${{ steps.builddir.outputs.out }}/hongscanner.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Upload attestation bundle + build report (90 days, public-repo cap)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hongscanner-${{ steps.platform.outputs.tag }}-attestation
          path: ${{ steps.builddir.outputs.out }}/attestation/
          retention-days: 90
          if-no-files-found: error

      # ------------------------------------------------------------ PR-5
      # collector subject: same attestation action, separate subject and
      # artifact names. The sidecar's only third-party dependency
      # (websockets==17.3) is version-pinned in the committed
      # tools/collector/requirements.txt the image installs verbatim.
      - name: Attest the collector binary (SLSA build provenance, OIDC-signed)
        id: attest-collector
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.builddir.outputs.out }}/collector
          subject-name: collector-${{ steps.platform.outputs.tag }}

      - name: Stage collector checksums, attestation bundle and build report
        env:
          BUNDLE_PATH: ${{ steps.attest-collector.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest-collector.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest-collector.outputs.attestation-url }}
          PLATFORM_TAG: ${{ steps.platform.outputs.tag }}
          OUT_DECLARED: ${{ steps.builddir.outputs.out }}
        run: |
          set -euo pipefail
          if [ -z "$CI_BUILD_OUT" ] || [ "$CI_BUILD_OUT" != "$OUT_DECLARED" ]; then
            echo "REFUSED: path channels diverged: CI_BUILD_OUT='${CI_BUILD_OUT}' builddir.out='${OUT_DECLARED}'" >&2
            exit 1
          fi
          if [ -z "$BUNDLE_PATH" ] || [ ! -f "$BUNDLE_PATH" ]; then
            echo "REFUSED: collector attestation bundle missing at '${BUNDLE_PATH}'" >&2
            exit 1
          fi
          if [ -e "${CI_BUILD_OUT}/collector.sha256" ] || [ -e "${CI_BUILD_OUT}/collector-attestation" ]; then
            echo "REFUSED: refusing to overwrite existing files in ${CI_BUILD_OUT}" >&2
            exit 1
          fi
          ( cd "$CI_BUILD_OUT" && sha256sum collector > collector.sha256 )
          mkdir "${CI_BUILD_OUT}/collector-attestation"
          cp "$BUNDLE_PATH" \
            "${CI_BUILD_OUT}/collector-attestation/collector.attestation.bundle.json"
          digest="$(sha256sum "${CI_BUILD_OUT}/collector" | cut -d' ' -f1)"
          {
            echo "collector attested release build (PR-5 second subject)"
            echo "subject name:    collector-${PLATFORM_TAG}"
            echo "subject digest:  sha256:${digest}"
            echo "built binary:    ${CI_BUILD_OUT}/collector (isolated runner-temp dir)"
            echo "main sha:        ${EXPECTED_SHA} (HEAD == re-fetched origin/main, tools/ci_build.sh)"
            echo "commit:          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${EXPECTED_SHA}"
            echo "workflow run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "ci gate:         workflow 'ci' success on ${EXPECTED_SHA}: ${CI_RUN_URL:-<unrecorded>}"
            echo "event/ref:       ${GITHUB_EVENT_NAME} / ${GITHUB_REF}"
            echo "runner:          ${RUNNER_NAME} $(uname -srm)"
            echo "nim:             $(nim --version | head -1)"
            echo "binary sha256:   ${digest}  collector"
            echo "attestation id:  ${ATTESTATION_ID:-}"
            echo "attestation url: ${ATTESTATION_URL:-}"
            echo "verify later:    gh attestation verify collector --repo ${GITHUB_REPOSITORY}"
          } > "${CI_BUILD_OUT}/collector-attestation/collector-build-report.txt"
          cat "${CI_BUILD_OUT}/collector-attestation/collector-build-report.txt"

      - name: Upload attested collector + sha256 (90 days, public-repo cap)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-${{ steps.platform.outputs.tag }}
          path: |
            ${{ steps.builddir.outputs.out }}/collector
            ${{ steps.builddir.outputs.out }}/collector.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Upload collector attestation bundle + build report (90 days, public-repo cap)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-${{ steps.platform.outputs.tag }}-attestation
          path: ${{ steps.builddir.outputs.out }}/collector-attestation/
          retention-days: 90
          if-no-files-found: error

      # ------------------------------------------------- image phase
      # Everything below is deliberately AFTER the binary attestations and
      # their artifact uploads: the local reinstall path
      # (tools/install-attested.sh) never depends on the image path. A
      # failure below still fails the job — nothing is swallowed.
      # CD policy: NO deployment step exists in this workflow, and no
      # `latest` tag is ever produced (immutable main-<sha7> convention).

      - name: Login to GHCR (github.actor + github.token)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Buildx (container driver: registry push + digest output)"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Stage the image build context (attested binaries + tracked files)
        id: imagectx
        run: |
          set -euo pipefail
          ctx="$(mktemp -d "${RUNNER_TEMP}/hs-image-ctx.XXXXXXXX")"
          mkdir -p "$ctx/bin" "$ctx/tools/api" "$ctx/tools/collector" \
                   "$ctx/tools/container" "$ctx/tools/notify" \
                   "$ctx/calendars"
          cp Dockerfile "$ctx/Dockerfile"
          cp .dockerignore "$ctx/.dockerignore"
          cp tools/api/serve.py "$ctx/tools/api/serve.py"
          cp tools/container/cloud_supervisor.py \
             "$ctx/tools/container/cloud_supervisor.py"
          cp calendars/CALENDAR_INDEX.sha256 "$ctx/calendars/CALENDAR_INDEX.sha256"
          cp tools/collector/sidecar.py "$ctx/tools/collector/sidecar.py"
          cp tools/collector/requirements.txt \
             "$ctx/tools/collector/requirements.txt"
          for f in notify_dispatcher.py notify_config.py notify_fcm.py \
                   notify_ledger.py; do
            cp "tools/notify/$f" "$ctx/tools/notify/$f"
          done
          # The staged binaries ARE the attested CI_BUILD_OUT binaries:
          # byte identity is asserted here, not assumed (README §2/§8).
          cp "${CI_BUILD_OUT}/hongscanner" "$ctx/bin/hongscanner"
          cp "${CI_BUILD_OUT}/collector" "$ctx/bin/collector"
          hs_want="$(sha256sum "${CI_BUILD_OUT}/hongscanner" | cut -d' ' -f1)"
          hs_got="$(sha256sum "$ctx/bin/hongscanner" | cut -d' ' -f1)"
          col_want="$(sha256sum "${CI_BUILD_OUT}/collector" | cut -d' ' -f1)"
          col_got="$(sha256sum "$ctx/bin/collector" | cut -d' ' -f1)"
          if [ "$hs_want" != "$hs_got" ] || [ "$col_want" != "$col_got" ]; then
            echo "REFUSED: staged binaries differ from CI_BUILD_OUT (hongscanner ${hs_want} != ${hs_got}, collector ${col_want} != ${col_got})" >&2
            exit 1
          fi
          # Calendar trust boundary (README §4): only the git-tracked
          # INDEX may reach the image; any calendar json in the staged
          # context is a refusal, exactly like the container contract test.
          if [ -n "$(find "$ctx/calendars" -name '*.json' -print -quit)" ]; then
            echo "REFUSED: a calendar json reached the staged image context" >&2
            exit 1
          fi
          # Immutable tag convention: exactly one tag, main-<sha7>, tied to
          # this exact main SHA. No latest, no mutable version tag.
          tag="main-$(printf '%s' "${EXPECTED_SHA}" | cut -c1-7)"
          echo "ctx=${ctx}" >> "$GITHUB_OUTPUT"
          echo "image-tag=ghcr.io/${GITHUB_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"
          echo "staged image context: ${ctx}"
          echo "image tag: ghcr.io/${GITHUB_REPOSITORY}:${tag}"

      - name: Build and push the production image to GHCR (immutable main-<sha7>)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.imagectx.outputs.ctx }}
          push: true
          tags: ${{ steps.imagectx.outputs.image-tag }}
          # No BuildKit-embedded provenance/sbom manifests: the SLSA
          # evidence for this image is the repository-level attestation on
          # the pushed digest below, and a single-config manifest keeps
          # that digest unambiguous. NO ci-test label: the production image
          # carries no org.hongscanner.image-purpose marker (README §3).
          provenance: false
          sbom: false

      - name: Verify the pushed digest (fail-closed before attesting it)
        env:
          IMAGE_REF: ${{ steps.imagectx.outputs.image-tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$' || {
            echo "REFUSED: image digest='${IMAGE_DIGEST}' is not sha256:<64 hex>" >&2
            exit 1
          }
          echo "IMAGE OK ref=${IMAGE_REF} digest=${IMAGE_DIGEST}"

      - name: Attest the pushed image digest (SLSA provenance on the GHCR subject)
        id: attest-image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # subject-name is the registry FQDN WITHOUT the tag (tags are
          # mutable; the digest is the identity), subject-digest is the
          # digest output of the push above, and push-to-registry binds
          # the attestation so `gh attestation verify oci://...` resolves
          # it (that read needs registry auth).
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Stage image attestation bundle and build report
        env:
          BUNDLE_PATH: ${{ steps.attest-image.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest-image.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest-image.outputs.attestation-url }}
          IMAGE_REF: ${{ steps.imagectx.outputs.image-tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$BUNDLE_PATH" ] || [ ! -f "$BUNDLE_PATH" ]; then
            echo "REFUSED: image attestation bundle missing at '${BUNDLE_PATH}'" >&2
            exit 1
          fi
          if [ -e "${CI_BUILD_OUT}/image-attestation" ]; then
            echo "REFUSED: refusing to overwrite existing ${CI_BUILD_OUT}/image-attestation" >&2
            exit 1
          fi
          mkdir "${CI_BUILD_OUT}/image-attestation"
          cp "$BUNDLE_PATH" \
            "${CI_BUILD_OUT}/image-attestation/image.attestation.bundle.json"
          {
            echo "production image attestation (PR-5)"
            echo "image ref:       ${IMAGE_REF}"
            echo "tag policy:      immutable main-<sha7> convention (one push per exact main SHA, never overwritten, no latest)"
            echo "image digest:    ${IMAGE_DIGEST}"
            echo "subject name:    ghcr.io/${GITHUB_REPOSITORY}"
            echo "main sha:        ${EXPECTED_SHA} (both attested binaries and this image build from the same SHA)"
            echo "commit:          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${EXPECTED_SHA}"
            echo "workflow run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "ci gate:         workflow 'ci' success on ${EXPECTED_SHA}: ${CI_RUN_URL:-<unrecorded>}"
            echo "event/ref:       ${GITHUB_EVENT_NAME} / ${GITHUB_REF}"
            echo "runner:          ${RUNNER_NAME} $(uname -srm)"
            echo "attestation id:  ${ATTESTATION_ID:-}"
            echo "attestation url: ${ATTESTATION_URL:-}"
            echo "verify later:    gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo "CD policy:       no automatic deployment in this workflow; Northflank placement is a manual step on a specific version tag (tools/container/README.md §8)"
          } > "${CI_BUILD_OUT}/image-attestation/image-build-report.txt"
          cat "${CI_BUILD_OUT}/image-attestation/image-build-report.txt"

      - name: Upload image attestation bundle + build report (90 days, public-repo cap)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hongscanner-image-attestation
          path: ${{ steps.builddir.outputs.out }}/image-attestation/
          retention-days: 90
          if-no-files-found: error
